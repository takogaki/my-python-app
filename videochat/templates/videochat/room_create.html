{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
配信作成｜SPIRYTUS
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'videochat/css/video_chat.css' %}">
{% endblock %}

{% block body %}
<link rel="stylesheet" href="{% static 'blog/css/blog.css' %}">

<div class="intro-card">
    <h2 class="page-title">配信を開始する</h2>
    <p class="page-description">
        新しいビデオチャットルームを作成します。
    </p>
</div>

<div class="post-form-card">
    <form method="post" enctype="multipart/form-data" class="room-create-form">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label">配信タイトル</label>
            <input type="text" name="title" required placeholder="例：雑談しながら作業します">
        </div>

        <div class="form-group">
            <label class="form-label">パスワード（任意）</label>
            <input type="text" name="password" placeholder="設定すると視聴者は入力必須">
            <p class="form-help">※ 未設定の場合は誰でも参加できます</p>
        </div>

        <div class="form-group">
            <label class="form-label">サムネイル</label>
            <input type="file" name="thumbnail" accept="image/*">
            <p class="form-help">配信一覧に表示される画像です</p>
        </div>

        <button type="submit" class="submit-btn">
            配信ルームを作成
        </button>
    </form>
</div>
{% endblock %}
