{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
管理人へ報告｜SPIRYTUS
{% endblock %}

{% block body %}

<section class="card">
    <h2 class="card-title">管理人に知らせる</h2>

    <p class="page-description">
        不具合・エラー・気になることがあれば、<br>
        そのまま書いて送ってください。
    </p>

    <form method="post">
        {% csrf_token %}
        <textarea name="content" class="form-textarea" rows="6" placeholder="例：〇〇を押したら画面が真っ白になりました" required></textarea>

        <div class="logout-wrapper">
            <button class="btn primary">送信する</button>
        </div>
    </form>
        
            <div class="terms-actions">
            
                <button type="button" class="btn-back" onclick="
                                if(history.length > 1){
                                    history.back();
                                }else{
                                    window.location.href='/';
                                }
                            ">
            
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#607d8b"
                        stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            
                        <path d="M9 11l-4 4l4 4m-4 -4h11a4 4 0 0 0 0 -8h-1" />
            
                    </svg>
            
                    戻る
            
                </button>
            
            </div>
</section>

{% endblock %}
