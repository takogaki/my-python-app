{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
送信完了 | SPIRYTUS
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/kyc.css' %}">
{% endblock %}

{% block body %}

<div class="kyc-container">

    <div class="kyc-card center">

        <h2 class="kyc-title">✅ 送信完了</h2>

        <p class="kyc-text">
            本人確認を送信しました。
        </p>

        <p class="kyc-subtext">
            この端末での操作は完了しています。<br>
            元のPC画面に戻ってください。
        </p>

        <!-- 🔥 閉じるボタン -->
        <button onclick="handleClose()" class="btn btn-primary kyc-submit" style="margin-top:20px;">
            この画面を閉じる
        </button>

    </div>

</div>

{% endblock %}

{% block extra_js %}
<script>
    function handleClose() {
        // 🔥 window.close()は効かないケース多いのでフォールバック
        window.close();

        // 🔥 ダメな場合は案内
        setTimeout(() => {
            alert("このタブを閉じて、PC画面に戻ってください。");
        }, 500);
    }
</script>
{% endblock %}
