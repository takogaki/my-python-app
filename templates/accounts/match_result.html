{% extends "base/diary_base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/match_risult.css' %}">
{% endblock %}

{% block body %}
<div class="match-wrapper">

    <div class="match-card">

        <h1 class="match-title">🎉 MATCH!</h1>
        <p class="match-sub">お互いにLIKEしました</p>

        <div class="match-user">
            <img src="{{ user.get_profile_image }}" class="avatar" alt="プロフィール画像">
            <span>{{ user.username }}</span>
        </div>

        <div class="actions">
            <a href="{% url 'user_messages:send_message' user.username %}" class="btn primary">
                💬 メッセージする
            </a>

            <a href="{% url 'accounts:user_detail' user.username %}" class="btn">
                👀 プロフィール
            </a>

            <div class="terms-actions">
            
                <button type="button" class="btn-back" onclick="
                                if(history.length > 1){
                                    history.back();
                                }else{
                                    window.location.href='/';
                                }
                            ">
            
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#607d8b"
                        stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            
                        <path d="M9 11l-4 4l4 4m-4 -4h11a4 4 0 0 0 0 -8h-1" />
            
                    </svg>
            
                    戻る
            
                </button>
            
            </div>
        </div>

    </div>

</div>
{% endblock %}
