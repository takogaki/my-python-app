{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
好きなときに、好きなだけ｜Lino
{% endblock %}

{% block body %}

<main class="top">
        <div class="dashboard">
                <h1 class="site-catch">好きなときに、好きなだけ</h1>

                <div class="top-lead">
                        <p>
                                送ってもいい。<br>
                                書いてもいい。<br>
                                話してもいい。<br>
                                見ているだけでもいい。
                        </p>
                        <p>何もしなくてもいい。</p>
                
                        <p>Lino は、いつでもここにあります。</p>
                </div>

                <!-- 💬 喋る場 -->
                <div class="dashboard-section">
                        <h3>💬 話す</h3>
                        <a href="{% url 'blog:frontpage' %}" class="dashboard-button">
                                入り口
                        </a>

                        <div class="disabled-box">
                                🚧 建設中（まだ使用できません）
                        </div>
                </div>

                <!-- 📖 日記 -->
                <div class="dashboard-section">
                        <h3>📖 残す</h3>
                        <a href="{% url 'diary:page_create' %}" class="dashboard-button">
                                日記を書く
                        </a>
                        <a href="{% url 'diary:page_list' %}" class="dashboard-button ghost">
                                日記一覧
                        </a>
                </div>

                <!-- 👥 ユーザー -->
                <div class="dashboard-section">
                        <h3>👥 探す</h3>
                        <a href="{% url 'accounts:user_list' %}" class="dashboard-button ghost">
                                登録ユーザー一覧
                        </a>
                </div>

                <!-- 🕊 メッセージ -->
                <div class="dashboard-section">
                        <a href="{% url 'user_messages:message_box' %}" class="dashboard-button primary">
                                💌 メッセージボックス
                        </a>
                </div>

                <!-- ⏰ 時計 -->
                <div class="dashboard-clock">
                        <div id="clock"></div>
                </div>

        </div>
</main>

{% endblock %}
