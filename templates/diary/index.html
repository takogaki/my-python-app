{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
好きなときに、好きなだけ｜SPIRYTUS
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'diary/css/diary_form.css' %}">
{% endblock %}

{% block body %}

<main class="top">
        <div class="dashboard">
                <h1 class="site-catch">好きなときに、好きなだけ</h1>

                <!-- 👥 ユーザー -->
                <div class="dashboard-section">
                        <h3>👥 探す</h3>
                        <a href="{% url 'accounts:user_list' %}" class="dashboard-button ghost">
                                登録ユーザー一覧
                        </a>
                </div>
                
                <!-- 🕊 メッセージ -->
                <div class="dashboard-section">
                        <a href="{% url 'user_messages:message_box' %}" class="dashboard-button primary">
                                💌 メッセージボックス
                        </a>
                </div>

                <!-- 💬 話す -->
                <div class="dashboard-section">
                        <h3>💬 書く</h3>
                        <a href="{% url 'blog:frontpage' %}" class="dashboard-button">
                                吐き出す。語り合う。
                        </a>
                </div>

                <div class="dashboard-section">
                        <h3>💬 話す</h3>    

                        <a href="{% url 'videochat:start' %}" class="dashboard-button">
                                自分が話す（ライブ開始）
                        </a>

                        <a href="{% url 'videochat:room_list' %}" class="dashboard-button ghost">
                                ライブ中の話し場を見る
                        </a>
                </div>

                <!-- 📖 日記 -->
                <div class="dashboard-section">
                        <h3>📖 残す</h3>
                        <a href="{% url 'diary:page_create' %}" class="dashboard-button">
                                日記を書く
                        </a>
                        <a href="{% url 'diary:page_list' %}" class="dashboard-button ghost">
                                日記一覧
                        </a>
                </div>

                <!-- ⏰ 時計 -->
                <div class="dashboard-clock">
                        <div id="clock"></div>
                </div>

        </div>
</main>

{% endblock %}
