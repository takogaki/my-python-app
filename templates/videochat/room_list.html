{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
ライブ中の話し場｜SPIRYTUS
{% endblock %}

{% block body %}
<section class="intro-card">
    <h2 class="page-title">🔴 配信中</h2>

    {% if rooms %}
    <ul class="room-list">
        {% for room in rooms %}
        <li class="room-card">
            <div class="room-card-body">
                <p class="room-title">
                    {{ room.title }}
                </p>

                <a href="https://meet.jit.si/{{ room.room_slug }}" target="_blank" class="room-join-button">
                    ▶ 参加する
                </a>
            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="empty-message">
        現在配信中のチャットはありません。
    </p>
    {% endif %}
</section>
{% endblock %}
