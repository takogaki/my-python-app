{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
ライブ中の話し場｜SPIRYTUS
{% endblock %}

{% block body %}
<h2>🔴 配信中</h2>

{% if live_rooms %}
<ul class="live-room-list">
    {% for room in live_rooms %}
    <li class="live-room-item">
        <p class="live-title">
            🎥 {{ room.title }}
        </p>

        <a href="https://meet.jit.si/{{ room.room_slug }}" target="_blank" class="join-link">
            ▶ 参加する
        </a>
    </li>
    {% endfor %}
</ul>
{% else %}
<p>現在配信中のチャットはありません。</p>
{% endif %}
{% endblock %}
