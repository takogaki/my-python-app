{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
パスワード入力｜SPIRYTUS
{% endblock %}

{% block body %}
<div class="dashboard">

    <h2>🔒 {{ room.title }}</h2>
    <p>この配信はパスワードが必要です</p>

    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="password" name="password" required>
        <button type="submit" class="submit-btn">
            入室する
        </button>
    </form>

</div>
{% endblock %}
