{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
パスワード入力｜SPIRYTUS
{% endblock %}

{% block body %}
<main class="top">
    <section class="intro-card password-card">

        <h2 class="page-title">
            🔒 パスワード付き配信
        </h2>

        <p class="password-room-title">
            {{ room.title }}
        </p>

        <form method="post" class="password-form">
            {% csrf_token %}

            <div class="form-group">
                <input type="password" name="password" placeholder="パスワードを入力" required>
            </div>

            {% if error %}
            <p class="form-error">
                {{ error }}
            </p>
            {% endif %}

            <button type="submit" class="dashboard-button primary">
                入室する
            </button>
        </form>

        <p class="password-note">
            この配信は、配信者が許可した方のみ参加できます。
        </p>

    </section>
</main>
{% endblock %}
