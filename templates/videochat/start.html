{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
配信を開始する｜SPIRYTUS
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'videochat/css/video_chat.css' %}">
{% endblock %}

{% block body %}
<main class="top">
    <div class="dashboard">

        <h1 class="site-catch">配信を開始する</h1>

        <form method="post" enctype="multipart/form-data" class="dashboard-section">
            {% csrf_token %}

            <div class="form-group">
                <label>タイトル</label>
                <input type="text" name="title" required>
            </div>

            <div class="form-group">
                <label>パスワード（任意）</label>
                <input type="text" name="password">
            </div>

            <!-- ★ サムネイル追加 -->
            <div class="form-group">
                <label>サムネイル画像（任意）</label>
                <input type="file" name="thumbnail" accept="image/*">
                <p class="form-help">
                    配信一覧に表示される画像です（未設定でも配信できます）
                </p>
            </div>

            <button type="submit" class="dashboard-button primary">
                次へ
            </button>
        </form>

    </div>
</main>
{% endblock %}
