<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>配信開始</title>
</head>

<body>
    <h1>配信を開始する</h1>

    <form method="post">
        {% csrf_token %}

        <div>
            <label>タイトル</label><br>
            <input type="text" name="title" required>
        </div>

        <div>
            <label>パスワード（任意）</label><br>
            <input type="text" name="password">
        </div>

        <button type="submit">配信開始</button>
    </form>
</body>

</html>
