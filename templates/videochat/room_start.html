<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>{{ room.title }}｜配信管理</title>
</head>

<body>

    <h2>🎥 配信管理画面</h2>
    <p>タイトル：{{ room.title }}</p>

    <!-- Jitsi は新しいタブで開く -->
    <a href="https://meet.jit.si/{{ room.room_slug }}" target="_blank" rel="noopener noreferrer">
        ▶ 配信開始（Jitsiを開く）
    </a>

    <hr>

    {% if request.user == room.host %}
    <form method="post" action="{% url 'videochat:room_end' room.room_slug %}">
        {% csrf_token %}
        <button type="submit">🛑 配信終了</button>
    </form>
    {% endif %}

</body>

</html>
