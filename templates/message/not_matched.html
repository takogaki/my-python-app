{% extends "base/diary_base.html" %}

{% block title %}メッセージ｜SPIRYTUS{% endblock %}

{% block extra_css %}
<style>
    /* =========================
   メッセージ利用不可画面
   ========================= */

    .message-unavailable {
        min-height: calc(100vh - 60px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;

        background:
            radial-gradient(circle at center,
                rgba(255, 255, 255, 0.045) 0%,
                rgba(0, 0, 0, 0) 55%),
            #080808;

        color: #fff;
        overflow: hidden;
    }

    /* =========================
   カード
   ========================= */

    .message-unavailable-card {
        width: min(420px, 100%);
        padding: 42px 30px 34px;

        text-align: center;

        background: linear-gradient(145deg,
                #171717,
                #0d0d0d);

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.04);

        box-sizing: border-box;
    }

    /* =========================
   アイコン
   ========================= */

    .message-unavailable-icon {
        width: 68px;
        height: 68px;

        margin: 0 auto 22px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #202020;
        border: 1px solid rgba(255, 255, 255, 0.08);

        font-size: 28px;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.35);
    }

    /* =========================
   タイトル
   ========================= */

    .message-unavailable-card h2 {
        margin: 0 0 16px;

        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.03em;

        color: #fff;
    }

    /* =========================
   本文
   ========================= */

    .message-unavailable-card p {
        margin: 0 auto;

        max-width: 340px;

        font-size: 14px;
        line-height: 1.8;

        color: #cfcfcf;
    }

    .message-unavailable-sub {
        margin-top: 10px !important;

        font-size: 12px !important;
        line-height: 1.7 !important;

        color: #777 !important;
    }

    /* =========================
   ボタン
   ========================= */

    .message-unavailable-actions {
        display: flex;
        gap: 10px;

        margin-top: 28px;
    }

    .message-btn {
        flex: 1;

        display: flex;
        align-items: center;
        justify-content: center;

        min-height: 46px;

        padding: 0 16px;

        border-radius: 12px;

        text-decoration: none;

        font-size: 13px;
        font-weight: 600;

        transition:
            transform 0.2s ease,
            background 0.2s ease,
            border-color 0.2s ease;
    }

    .message-btn:hover {
        transform: translateY(-1px);
    }

    /* メイン */
    .message-btn.primary {
        background: #fff;
        color: #111;
    }

    .message-btn.primary:hover {
        background: #e8e8e8;
    }

    /* サブ */
    .message-btn.secondary {
        background: #191919;
        color: #ddd;

        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message-btn.secondary:hover {
        background: #242424;
        border-color: rgba(255, 255, 255, 0.18);
    }

    /* =========================
   スマホ
   ========================= */

    @media (max-width: 480px) {

        .message-unavailable {
            min-height: calc(100vh - 50px);
            padding: 16px;
        }

        .message-unavailable-card {
            padding: 36px 22px 28px;
            border-radius: 22px;
        }

        .message-unavailable-card h2 {
            font-size: 18px;
        }

        .message-unavailable-actions {
            flex-direction: column;
        }

        .message-btn {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block body %}

<div class="message-unavailable">

    <div class="message-unavailable-card">

        <div class="message-unavailable-icon">
            💬
        </div>

        <h2>このメッセージは現在利用できません</h2>

        <p>
            お互いのLIKEが成立している間のみ、
            メッセージをご利用いただけます。
        </p>

        <p class="message-unavailable-sub">
            相互LIKEが解除されたため、
            このチャットは一時的に利用できません。
        </p>

        <div class="message-unavailable-actions">

            <a href="{% url 'accounts:user_detail' username=target_user.username %}" class="message-btn primary">
                プロフィールを見る
            </a>

            <a href="{% url 'accounts:user_list' %}" class="message-btn secondary">
                ユーザー一覧へ
            </a>

        </div>

    </div>

</div>

{% endblock %}
