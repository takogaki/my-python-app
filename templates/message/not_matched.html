{% extends "base/diary_base.html" %}
{% load static %}

{% block title %}
メッセージ｜SPIRYTUS
{% endblock %}


{% block extra_css %}

<style>
    /* =========================================================
   🚫 DM利用不可画面
   ヘッダー・フッターを邪魔しない独立レイアウト
   ========================================================= */


    /* =========================================================
   🌑 メイン領域
   ========================================================= */

    .message-unavailable {
        position: fixed !important;

        top: var(--header-height) !important;
        left: 0 !important;
        right: 0 !important;
        bottom: var(--footer-height) !important;

        width: 100vw !important;
        height: auto !important;

        margin: 0 !important;
        padding: 20px !important;

        box-sizing: border-box !important;

        display: flex !important;
        align-items: center !important;
        justify-content: center !important;

        overflow: hidden !important;

        z-index: 9999 !important;

        background:
            radial-gradient(
                circle at center,
                rgba(255, 255, 255, 0.045) 0%,
                rgba(0, 0, 0, 0) 55%
            ),
            #080808 !important;

        color: #fff !important;
    }


    /* =========================================================
   🖤 カード
   ========================================================= */

    .message-unavailable-card {

        position: relative !important;

        width: min(420px, 100%) !important;
        max-width: 420px !important;

        margin: 0 !important;

        padding:
            42px 30px 34px !important;

        box-sizing: border-box !important;

        text-align: center !important;

        background:
            linear-gradient(145deg,
                #171717,
                #0d0d0d) !important;

        border:
            1px solid rgba(255, 255, 255, 0.08) !important;

        border-radius: 24px !important;

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.04) !important;

        color: #fff !important;
    }


    /* =========================================================
   💬 アイコン
   ========================================================= */

    .message-unavailable-icon {

        width: 68px !important;
        height: 68px !important;

        margin:
            0 auto 22px !important;

        padding: 0 !important;

        display: flex !important;

        align-items: center !important;
        justify-content: center !important;

        box-sizing: border-box !important;

        border-radius: 50% !important;

        background: #202020 !important;

        border:
            1px solid rgba(255, 255, 255, 0.08) !important;

        font-size: 28px !important;
        line-height: 1 !important;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.35) !important;
    }


    /* =========================================================
   📝 タイトル
   ========================================================= */

    .message-unavailable-card h2 {

        margin:
            0 0 16px !important;

        padding: 0 !important;

        font-size: 20px !important;

        line-height: 1.5 !important;

        font-weight: 700 !important;

        letter-spacing: 0.03em !important;

        color: #fff !important;
    }


    /* =========================================================
   📄 本文
   ========================================================= */

    .message-unavailable-card p {

        margin:
            0 auto !important;

        padding: 0 !important;

        max-width: 340px !important;

        font-size: 14px !important;

        line-height: 1.8 !important;

        color: #cfcfcf !important;
    }


    .message-unavailable-card .message-unavailable-sub {

        margin-top: 10px !important;

        font-size: 12px !important;

        line-height: 1.7 !important;

        color: #777 !important;
    }


    /* =========================================================
   🔘 ボタンエリア
   ========================================================= */

    .message-unavailable-actions {

        display: flex !important;

        gap: 10px !important;

        margin:
            28px 0 0 !important;

        padding: 0 !important;

        width: 100% !important;

        box-sizing: border-box !important;
    }


    /* =========================================================
   🔘 ボタン共通
   ========================================================= */

    .message-unavailable-actions .message-btn {

        flex: 1 1 0 !important;

        width: auto !important;

        min-height: 46px !important;

        margin: 0 !important;

        padding:
            0 16px !important;

        display: flex !important;

        align-items: center !important;
        justify-content: center !important;

        box-sizing: border-box !important;

        border-radius: 12px !important;

        text-decoration: none !important;

        font-size: 13px !important;

        font-weight: 600 !important;

        line-height: 1 !important;

        transition:
            transform 0.2s ease,
            background 0.2s ease,
            border-color 0.2s ease !important;
    }


    .message-unavailable-actions .message-btn:hover {

        transform:
            translateY(-1px) !important;
    }


    /* =========================================================
   ⚪ プライマリ
   ========================================================= */

    .message-unavailable-actions .message-btn.primary {

        background: #fff !important;

        color: #111 !important;

        border:
            1px solid #fff !important;
    }


    .message-unavailable-actions .message-btn.primary:hover {

        background: #e8e8e8 !important;
    }


    /* =========================================================
   ⚫ セカンダリ
   ========================================================= */

    .message-unavailable-actions .message-btn.secondary {

        background: #191919 !important;

        color: #ddd !important;

        border:
            1px solid rgba(255, 255, 255, 0.1) !important;
    }


    .message-unavailable-actions .message-btn.secondary:hover {

        background: #242424 !important;

        border-color:
            rgba(255, 255, 255, 0.18) !important;
    }


    /* =========================================================
   📱 スマートフォン
   ========================================================= */

    @media (max-width: 600px) {

        .message-unavailable {

            top: var(--header-height) !important;
            bottom: var(--footer-height) !important;

            padding: 16px !important;
        }


        .message-unavailable-card {

            width: 100% !important;

            padding:
                36px 22px 28px !important;

            border-radius: 22px !important;
        }


        .message-unavailable-card h2 {

            font-size: 18px !important;
        }


        .message-unavailable-actions {

            flex-direction: column !important;

            gap: 9px !important;
        }


        .message-unavailable-actions .message-btn {

            width: 100% !important;

            flex: none !important;
        }
    }


    /* =========================================================
   📱 iPhone Safari
   ========================================================= */

    @supports (-webkit-touch-callout: none) {

        .message-unavailable {

            /*
         * ヘッダー・フッターを残すため
         * fill-available は使用しない
         */
            height: auto !important;
        }
    }
</style>

{% endblock %}


{% block body %}

<div class="message-unavailable">

    <div class="message-unavailable-card">

        <div class="message-unavailable-icon">
            💬
        </div>


        <h2>
            このメッセージは現在利用できません
        </h2>


        <p>
            お互いのLIKEが成立している間のみ、
            メッセージをご利用いただけます。
        </p>


        <p class="message-unavailable-sub">
            相互LIKEが解除されたため、
            このチャットは一時的に利用できません。
        </p>


        <div class="message-unavailable-actions">

            <a href="{% url 'accounts:user_detail' username=target_user.username %}" class="message-btn primary">
                プロフィールを見る
            </a>


            <a href="{% url 'accounts:user_list' %}" class="message-btn secondary">
                ユーザー一覧へ
            </a>

        </div>

    </div>

</div>

{% endblock %}
```
