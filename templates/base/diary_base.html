<!DOCTYPE html>
<html lang="ja">

{% load static %}

<head>

    <meta name="google-site-verification" content="GUHdMs02t79910_YzaHxrFxZIThm4GNQdTJ0NKlbR98" />

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'diary/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'blog/css/blog_form.css' %}">
    <link rel="stylesheet" href="{% static 'blog/css/blog.css' %}">

    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="{% static 'blog/js/blog.js' %}"></script>
    <script src="{% static 'diary/js/base.js' %}"></script>
    <!-- blog.js の読み込み -->
    <script src="{% static 'blog/js/blog.js' %}"></script>

    <meta charset="utf-8">
    <title>あなたの気持ちを、ひとりで抱えなくていい場所｜いつでも言葉にできるサイト</title>

    <meta name="description"
        content="あなたの気持ちを、いつでも言葉にして残せる場所です。日記や投稿を通して、笑ったり共感したり、無理のない交流ができます。誰かと話したいときも、静かに気持ちを書きたいときも利用できます。">

</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <h1 class="site-title">
                <a href="{% url 'diary:index' %}">喋る場</a>
            </h1>

            <div class="user-area">
                {% if user.is_authenticated %}
                <span class="welcome">
                    こんにちは、<a class="btn btn-outline" href="{% url 'accounts:mypage' %}">{{ request.user.username }}</a>さん
                    <p class="user-count">
                        ログインユーザー数：{{ logged_in_users_count }}
                    </p>
                </span>
                {% else %}
                <a class="btn btn-outline" href="{% url 'accounts:login' %}">ログイン</a>
                <a class="btn" href="{% url 'accounts:signup' %}">新規登録</a>
                <p class="user-count">
                    ログインユーザー数：{{ logged_in_users_count }}
                </p>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="container">
        {% block body %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <small>© 喋る場</small>
    </footer>
</body>

</html>

</html>
