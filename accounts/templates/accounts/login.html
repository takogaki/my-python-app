{% extends "base/diary_base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
{% endblock %}


{% block body %}

<div class="login-wrapper">

    <!-- ヘッダー -->
    <div class="login-header">
        <h1 class="login-title">SPIRYTUS</h1>
        <p class="login-subtitle">ログインしてください</p>
    </div>

    <!-- フォームカード -->
    <div class="login-card">

        <form method="post" autocomplete="off" class="login-form">
            {% csrf_token %}

            <div class="input-group">
                <label>ユーザー名またはメールアドレス</label>
                <input type="text" name="username" autocomplete="username" placeholder="ユーザー名またはメールアドレス">
            </div>

            <div class="input-group">
                <label>パスワード</label>
                <input type="password" name="password" autocomplete="new-password" placeholder="password">
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="login-btn">
                ログイン
            </button>
        </form>

        <div class="login-footer">
            <p>アカウントをお持ちでない方</p>
            <a href="{% url 'accounts:signup' %}?next={{ request.GET.next }}">
                新規登録はこちら
            </a>
        </div>

    </div>

</div>

{% endblock %}
