{% extends "base/diary_base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'videos/css/upload.css' %}">
{% endblock %}

{% block body %}

<div class="upload-wrapper">

    <div class="upload-card">

        <div style="
            margin-bottom:25px;
            padding:15px;
            background:#f7f7f7;
            border-radius:14px;
        ">
        
            <div style="
                font-weight:bold;
                margin-bottom:8px;
            ">
                🤝 一緒に遊ぶ人を募集しませんか？
            </div>
        
            <a href="{% url 'recruit_create' %}" style="
                    display:inline-block;
                    padding:10px 15px;
                    border-radius:10px;
                    background:#222;
                    color:#fff;
                    text-decoration:none;
                    font-weight:bold;
                ">
                新しい募集を作成
            </a>
        
        </div>

        <h1 class="title">投稿する</h1>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" enctype="multipart/form-data" class="upload-form">
            {% csrf_token %}

            <div class="field">
                <label>タイプ</label>
                <select name="media_type">
                    <option value="video">動画</option>
                    <option value="image">画像</option>
                </select>
            </div>

            <div class="field">
                <label>メディア</label>
                <input type="file" name="media" accept="image/*,video/*">
            </div>

            <div class="field">
                <label>キャプション</label>
                <textarea name="caption" placeholder="今日の一言を入力..."></textarea>
            </div>

            <button type="submit" class="submit-btn">投稿する</button>

        </form>

    </div>

</div>

{% endblock %}
